name = "Physlib"

defaultTargets = ["QuantumInfo"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "master-2026-08-21"

[[lean_lib]]
name = "Physlib"
moreLeanArgs = ["-Dwarn.sorry=false", "-Dweak.says.verify=true"]

[[lean_lib]]
name = "PhyslibAlpha"
moreLeanArgs = ["-Dwarn.sorry=false", "-Dweak.says.verify=true"]

[[lean_lib]]
name = "QuantumInfo"
moreLeanArgs = ["-Dwarn.sorry=false", "-Dweak.says.verify=true"]
